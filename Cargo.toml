[workspace]
resolver = "2"
members = [
    "crates/xmind-core",
    "crates/xmind-cli",
    "crates/xmind-app",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zip = "2"
quick-xml = "0.36"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"
fontdb = "0.16"
flate2 = "1"
chrono = "0.4"
dirs = "5"
egui = "0.29"
eframe = "0.29"
rfd = "0.15"

[profile.release]
opt-level = 2
